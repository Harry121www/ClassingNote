server:
  port: 8080

spring:
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:h2:file:./data/database;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_RECONNECT=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  version: 1.0.0
  data-directory: ./data
  attachment-root-path: ./classnote-files
